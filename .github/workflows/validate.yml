name: validate

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup.sh parses
        run: bash -n setup.sh

      - name: setup.sh is executable
        run: test -x setup.sh

      - name: manifests are valid JSON
        run: |
          python3 -m json.tool .claude-plugin/plugin.json > /dev/null
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null

      # The plugin loader only reads agents from the default `agents/` directory
      # at the plugin root; a path in plugin.json validates but loads nothing,
      # and a symlink does not survive the plugin cache copy. So the file exists
      # twice on purpose, and this step is what keeps the two in step.
      - name: planner agent copies agree
        run: diff -u .claude/agents/planner.md agents/planner.md

      - name: no .DS_Store is tracked
        run: |
          if git ls-files | grep -q '\.DS_Store$'; then
            echo "a .DS_Store file is tracked"; exit 1
          fi

      # 33 assertions covering symlinks, dangling symlinks, symlinked parent
      # directories, hard links, glob and newline characters in paths, a
      # partially populated target, a non-interactive run and a failed write.
      - name: install-safety suite
        run: bash tests/install-safety.sh "$PWD" /tmp/upf-install-safety
