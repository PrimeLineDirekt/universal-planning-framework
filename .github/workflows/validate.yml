name: validate

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup.sh parses
        run: bash -n setup.sh

      - name: setup.sh is executable
        run: test -x setup.sh

      - name: manifests are valid JSON
        run: |
          python3 -m json.tool .claude-plugin/plugin.json > /dev/null
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null

      # planner.md exists at two paths on purpose. Measured on Claude Code
      # 2.1.241 by installing the plugin and reading `claude plugin details`,
      # not by reading the manifest docs:
      #
      #   "agents": ["./.claude/agents/planner.md"]  validate PASS  Agents (0)
      #   "agents": ["./.claude/agents/"]            validate FAIL
      #   agents/planner.md at the plugin root       validate PASS  Agents (1)
      #   agents/planner.md as a symlink             validate PASS  Agents (0)
      #
      # `commands` does NOT behave this way: "./.claude/commands/" loaded all
      # four. So the two fields differ in practice whatever the docs say, and
      # this step is what keeps the two copies from drifting.
      - name: planner agent copies agree
        run: diff -u .claude/agents/planner.md agents/planner.md

      - name: manifest, marketplace and changelog agree on the version
        run: |
          PV=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          MV=$(python3 -c "import json;print(json.load(open('.claude-plugin/marketplace.json'))['plugins'][0]['version'])")
          CV=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')
          echo "plugin=$PV marketplace=$MV changelog=$CV"
          test "$PV" = "$MV"
          test "$PV" = "$CV"
          grep -q "version-$PV-green" README.md

      - name: no .DS_Store is tracked
        run: |
          if git ls-files | grep -q '\.DS_Store$'; then
            echo "a .DS_Store file is tracked"; exit 1
          fi

      # Covers symlinks, dangling symlinks, symlinked parent directories, hard
      # links, glob and newline characters in paths, a partially populated
      # target, a non-interactive run, a failed write, permission preservation
      # and both flavours of stat. The suite prints its own assertion count, so
      # no number is repeated here to go stale.
      - name: install-safety suite
        run: bash tests/install-safety.sh "$PWD" /tmp/upf-install-safety

      # The plugin route reaches the rulebook only through these two paths. A
      # rename would break it silently, since the plugin still installs cleanly.
      - name: skill loaders point at files that exist
        run: |
          fail=0
          for f in skills/*/SKILL.md; do
            grep -o '\${CLAUDE_PLUGIN_ROOT}/[^`]*\.md' "$f" | while read -r p; do
              rel=${p#\$\{CLAUDE_PLUGIN_ROOT\}/}
              if [ ! -f "$rel" ]; then echo "$f points at missing $rel"; exit 1; fi
              echo "$f -> $rel  OK"
            done || fail=1
          done
          test "$fail" -eq 0
          test "$(grep -lc 'CLAUDE_PLUGIN_ROOT' skills/*/SKILL.md | wc -l)" -eq 2
